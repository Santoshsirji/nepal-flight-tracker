name: Track flights

on:
  schedule:
    # Backup timer only: GitHub skips many scheduled runs, so cron-job.org
    # triggers this workflow every 20 minutes through workflow_dispatch.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, full, quick, or test"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest state, not the commit from when this run was queued

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py "${{ inputs.mode || 'auto' }}"

      - name: Save state
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update flight state"
          # If another run saved in the meantime, keep its state and drop ours.
          git pull --rebase || { git rebase --abort; exit 0; }
          git push
